AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AMM serverless purchase approval API

Parameters:
  StageName:
    Type: String
    Default: Prod
  AllowedOrigin:
    Type: String
    Default: http://localhost:3000
  ApproverAppUrl:
    Type: String
    Default: http://localhost:3000
  TokenPepper:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Secret used to hash invitation tokens, OTPs and approval sessions

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [x86_64]
    MemorySize: 512
    Timeout: 30
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref PurchaseApprovalTable
        EVIDENCE_BUCKET: !Ref EvidenceBucket
        TOKEN_PEPPER: !Ref TokenPepper
        APPROVER_APP_URL: !Ref ApproverAppUrl
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        ENABLE_MOCK_MAIL: "true"

Resources:
  PurchaseApprovalApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref StageName
      TracingEnabled: true
      Cors:
        AllowOrigin: !Sub "'${AllowedOrigin}'"
        AllowHeaders: "'Content-Type,X-Requester-Id'"
        AllowMethods: "'GET,POST,OPTIONS'"

  PurchaseApprovalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/interfaces/http/handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PurchaseApprovalTable
        - S3CrudPolicy:
            BucketName: !Ref EvidenceBucket
      Events:
        Health: { Type: Api, Properties: { RestApiId: !Ref PurchaseApprovalApi, Path: /health, Method: GET } }
        Users: { Type: Api, Properties: { RestApiId: !Ref PurchaseApprovalApi, Path: /users, Method: GET } }
        CreateRequest: { Type: Api, Properties: { RestApiId: !Ref PurchaseApprovalApi, Path: /requests, Method: POST } }
        ListRequests: { Type: Api, Properties: { RestApiId: !Ref PurchaseApprovalApi, Path: /requests, Method: GET } }
        GetRequest: { Type: Api, Properties: { RestApiId: !Ref PurchaseApprovalApi, Path: "/requests/{id}", Method: GET } }
        Evidence: { Type: Api, Properties: { RestApiId: !Ref PurchaseApprovalApi, Path: "/requests/{id}/evidence.pdf", Method: GET } }
        RequestOtp: { Type: Api, Properties: { RestApiId: !Ref PurchaseApprovalApi, Path: /approvals/request-otp, Method: POST } }
        ValidateOtp: { Type: Api, Properties: { RestApiId: !Ref PurchaseApprovalApi, Path: /approvals/validate-otp, Method: POST } }
        Decision: { Type: Api, Properties: { RestApiId: !Ref PurchaseApprovalApi, Path: /approvals/decision, Method: POST } }
        MockMail: { Type: Api, Properties: { RestApiId: !Ref PurchaseApprovalApi, Path: /mock-mail, Method: GET } }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/interfaces/http/handler.ts]
        Minify: true
        Sourcemap: true
        Target: es2022

  PurchaseApprovalTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification:
        AttributeName: expiresAtEpoch
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  EvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }

Outputs:
  ApiUrl:
    Description: Base URL for the HTTP API
    Value: !Sub "https://${PurchaseApprovalApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}"
  TableName:
    Value: !Ref PurchaseApprovalTable
  EvidenceBucketName:
    Value: !Ref EvidenceBucket
